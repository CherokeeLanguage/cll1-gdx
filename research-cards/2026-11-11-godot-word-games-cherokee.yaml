# Research card — Godot word games with friendly licenses, for a Cherokee-syllabary word game
# Confidence: 0.8 (discovery good-but-not-exhaustive; verdicts code-verified; per-asset licenses unaudited)
# All sources fetched live 2026-11-11. Method: 4 research dispatches (web discovery x3 + code audit x1);
# ~260 itch/LD pages + ~60 repo verifications; every license verified by fetching the LICENSE file
# (never badges); every Godot claim verified via project.godot/engine.cfg fetch.

topic: open-source Godot word games (any mechanics) with friendly licenses, evaluated for
  reuse/adaptation to a Cherokee-syllabary word game

developer_constraints:
  - exact wordle-likeness NOT required — any word-game mechanics qualify
  - game words are Cherokee Syllabary (uppercase practice U+13A0-U+13F4; Supplement U+AB70-ABBF
    lowercase exists but org games store/render uppercase only)
  - Godot is Unicode — Latin vs non-Latin rendering is not the differentiator; the risk is
    alphabet-size premises in game logic (85+ symbols vs 26-letter assumptions)
  - fixed letter grids / word lengths are parameterization, not blockers
  - the org's own games (CherokeeLanguage/*) are NOT valid references — developer direction
    2026-11-11; recommendations rank external repos only

license_landscape:
  friendly: [MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, zlib, MPL-2.0, CC0]
  friendly_meaning: notice-keeping obligations only; derivative app may stay proprietary
  copyleft: GPL-3.0 makes the whole derivative GPL; LGPL-3.0 keeps only the library portion open
  no_license_stated: all-rights-reserved by default — the DOMINANT failure mode in this niche
    (~30 Godot word-game repos confirmed unlicensed, esp. jam-derived)
  wordle_trademark: WORDLE is a registered NYT mark (Reg. 8007319, registered 2025-11-04); TTAB
    sustained opposition vs "WORLDLE" 2026-11-04; NYT ran DMCA takedowns vs clone repos 2024.
    Mechanics are free to use; the NAME and trade dress are not — use distinct branding.
  original_wordle_code: unlicensed (powerlanguage repo license: null) — never copy
  word_lists: NYT-era curated list unlicensed — build own or CC0 lists; community pattern is
    Hunspell/wordfreq-derived lists

verdicts:
  direct:
    - repo: https://github.com/CherokeeLanguage/NumbersMaze.godot
      license: Apache-2.0
      godot: 3.x (config_version=4, GLES2, active 2026-11-11)
      why: gamepad/TV-remote multiple-choice numeric model — zero symbol enumeration; syllabary
        appears only as display-string vocabulary (const arrays); TTF → DynamicFontData/DynamicFont
        .tres → Label.text pattern proven in production; user:// slot saves; itch-only distribution
    - repo: https://github.com/CherokeeLanguage/Animals
      license: MIT
      godot: 3.3 (crystal-bit game template: menus, scene transitions, autoloads, CI exports)
      why: whole-word-keyed picture+audio data model — 80 entries generated by
        create_challenge_data.py from a `SYLLABARY|pronunciation|latin|mp3` fixture; no alphabet
        assumptions anywhere. CAVEAT: master-branch play loop UNBUILT (gameplay.gd is template
        boilerplate; port in progress)
    - repo: https://github.com/koyomivanp/moji-othello
      license: MIT
      godot: "4.6"
      why: hiragana word-formation board game; input is a 5-choice hand + mouse placement (no
        keyboard — alphabet-size independent); kana pools are two one-line const arrays to swap;
        hiragana Unicode range filter is a one-line swap to U+13A0-13F4; grid/length constants
        single-file; no frequency tables
    - repo: https://github.com/oktaycosar/harf-yilani
      license: MIT
      godot: "4.7"
      why: Snake-style spelling game; input is directional movement only; TURKISH_ALPHABET is a
        one-line const consumed ONLY for bonus decoys; word lengths already per-difficulty-tier
        data; no frequency tables. (Font swap required — bundled pixel font lacks syllabary.)
  moderate:
    - repo: https://github.com/aLackoProjects/langle-godot
      license: GPL-3.0  # COPYLEFT — derivative must be GPL; steal the PATTERN, not the code
      godot: "4.3"
      why: BEST architecture found — mod manifest.json externalizes `valid_letters` (the symbol
        set) AND the word lists; on-screen keyboard auto-generates from the symbol set at runtime
        (4-per-row, scrollable container exists); unicode fallback path accepts arbitrary code
        points. Fixed 5-letter/6-row core smeared across game_global.gd/word.gd/main.gd needs
        parameterization. 85 keys ⇒ ~22 rows at 4/row (UX sizing unverified)
    - repo: https://github.com/Awfyboy/Azerdle
      license: MIT
      godot: "4.3"
      why: wordle baseline — per-block state machine and word-list loading are symbol-agnostic,
        but 26 keys are HAND-PLACED QWERTY scene nodes + a hardcoded alphabet_list physical-key
        filter + 5×6 scene constants; keyboard must be code-generated for 85 symbols
    - repo: https://github.com/KooNphonii/Koo-Word-Jigsaw
      license: MIT
      godot: "4.6"
      why: drag-path tile-selection mechanics are symbol- and grid-agnostic (ID-based path
        validation), but tiles/puzzle-words/find-lists are triple-baked across main.tscn +
        word_manager.gd with NO data files — data-driving is the whole port effort
  fundamental_rework: none found among licensed candidates — every alphabet premise was either a
    one-line constant or a hand-built Latin keyboard scene

org_prior_art:
  excluded_as_references: "developer direction 2026-11-11 — CherokeeLanguage/* repos are not
    valid references for this research; retained below only as internal pattern documentation"
  - NumbersMaze.godot + Animals — org-internal, syllabary-native
  - CherokeeLanguage/Syllabary — libGDX syllabary drill, NO license; notable design: deliberate
    multi-typeface glyph variation (Aboriginal Serif, CherokeeHandone, Digohweli…) for
    recognition robustness
  - reusable non-game data: cherokee-vocab-data (Apache-2.0), cherokeedictionary (MIT),
    cherokee-audio-data (CC0-1.0)

fonts:
  recommended: Noto Sans Cherokee — SIL OFL 1.1 (notofonts/cherokee), covers U+13A0-13FF AND
    U+AB70-ABBF; license-clean bundling
  org_fonts_caution: CherokeeHandone / CherokeeHandoneB (bundled by ALL org games; credit Joseph
    Erb) — NO license text locatable anywhere; org-internal choice, not a reusable template license
  avoid: Gadugi (MS redistribution program, not open), Cherokee Nation fonts ("not-for-profit"
  clause), nkCherokee (CC BY-SA 3.0, awkward for fonts)
  decorative_option: SequoyahCaligraph (Cherokee-Language-Technology, MIT) — syllabary-only
    glyphs, poor kerning; titles/art only

rendering_facts:
  - Cherokee needs NO complex text shaping — HarfBuzz shaper dispatch has no Cherokee entry;
    default cmap mapping suffices (verified in harfbuzz source)
  - Godot 3.x DynamicFont rendering proven adequate by both org games; Godot 4 TextServerAdvanced
    (HarfBuzz/ICU) also fine
  - editor gotcha (worth copying): editing syllabary literals requires an editor font with
    Cherokee glyphs — FreeMono (GNU FreeFonts) works; org repos document this in-file
  - zero Cherokee-specific rendering bugs found in godotengine/godot issue search

top_recommendations:
  - "1. Tobyjcode/wordle — MIT, Godot 4.6, DIRECT (wordle-family audit): least-work syllabary
     wordle base. Parameterized RefCounted core (_word_length/_max_attempts as instance vars),
     runtime word list self-filtered by length, duplicate-CORRECT two-pass feedback (critical for
     repeated syllables), GUT test suite with ≥70% coverage gate, keyboard code-generated from a
     3-string layout array. Work: make generated keys clickable (~20-line change — today they are
     feedback-only ColorRects), replace QWERTY layout strings with syllabary rows, set word length
     from data, drop the a-z physical-key filter, swap font + word list"
  - "2. Awfyboy/Azerdle — MIT, Godot 4.3, moderate: most-starred licensed wordle (19★);
     symbol-agnostic state machine but 26 hand-placed QWERTY scene keys + alphabet_list physical
     filter + 5×6 scene constants to regenerate/parameterize"
  - "3. composite pattern: borrow langle-godot's mod-manifest symbol-set externalization (GPL —
     pattern only) and Brawmario's clickable-Button keyboard UX MINUS its ASCII byte-encoding
     plumbing; The-Wizard-Coder/Wordle-Puzzle (MIT) is the alternative only if a from-scratch
     minimal shell is wanted — it has NO input layer and a naive duplicate-feedback bug;
     raf-aye/wordle-godot is dominated on every axis. moji-othello (MIT, direct) and
     harf-yilani (MIT, direct) remain the best non-wordle mechanic options if the style changes"

gaps:
  - itch.io made-with-godot word tags are single-page listings (exhaustively walked, ~215 pages);
    Ludum Dare coverage partial (API 403; title-keyword search over ~115 pages; entries whose
    source links live in comments/devlogs missed)
  - per-asset licenses inside candidate repos not audited file-by-file; one known trap:
    100-Devs-1-Game/TheTypingExperiment is MIT code but CC BY-NC-SA assets
  - GitLab/Codeberg/Gitea/Sourcehut coverage minimal (2 probes)
  - Animals' actual answer-presentation code does not exist on master to inspect (design-note
    evidence only); gdx_legacy branch not fetched

wordle_family_audit:
  note: follow-up audit after developer steer that wordle-like/similar style is the preferred
    STARTING POINT; all six primary scripts + key scenes read directly, 2026-11-11
  direct:
    - repo: https://github.com/Tobyjcode/wordle
      license: MIT
      godot: "4.6"
      evidence: core is a UI-free RefCounted class with `var _word_length` parameter +
        self-filtering runtime word list (FileAccess → filter by length); feedback is
        duplicate-correct two-pass green/yellow/gray with occurrence counting; GUT suite includes
        test_feedback_duplicates regression + ≥70% coverage gate; keyboard code-generated from
        `var keyboard_rows := ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"]` (3-string layout array)
      work_items: generated keys are non-interactive ColorRects → convert to clickable Buttons
        (~20 lines); 30 board tiles hand-placed in scene (fine if grid stays fixed); drop a-z
        physical-key filter; swap word list + font
  moderate:
    - repo: https://github.com/The-Wizard-Coder/Wordle-Puzzle
      license: MIT
      godot: "4.2"
      why_not_base: no input layer exists at all (physical-keyboard only, 25 hand-placed scene
        buttons); naive duplicate feedback (excess duplicates color 'present' incorrectly —
        misleads on Cherokee words with repeated syllables); smallest codebase
    - repo: https://github.com/raf-aye/wordle-godot
      license: MIT
      godot: "4.2"
      why_not_base: display-only keyboard, keycode+as_text_keycode Latin coupling, fragile
        node-name-addressed rows, 5-attempt variant, naive duplicate feedback — dominated by
        Tobyjcode on every axis
    - repo: https://github.com/Brawmario/godot-wordle
      license: GPL-3.0-or-later  # derivative must be GPL
      godot: "4.3"
      why_context: most polished vanilla wordle (clickable Button keyboard, daily word,
        dual-list validation, duplicate-correct feedback) but 26 hand-placed keys encode key
        text as single ASCII bytes (structurally breaks for multi-byte syllabary symbols) and
        both word lists are script constants. Steal the keyboard-UX pattern, not the plumbing
    - repo: https://github.com/AmoghKhaparde/Wordle
      license: GPL-3.0
      godot: "4.3"
      why_context: duplicate-correct logic exists but interleaved with UI; inline ~1300-word
        literal array; ASCII-range physical-only input; per-frame keyboard-dict rebuild —
        rewrite-in-place, not parameterization
    - repo: https://github.com/jonas-popp/word-quiz
      license: GPL-3.0
      godot: 3.x (needs 3→4 migration)
      why_context: best keyboard-architecture IDEA (per-language layout strings as data,
        already exercises >26 keys with umlauts) but implemented by re-parenting a fixed scene
        node pool — 85 syllabary keys need a pool rebuild; brittle 6-byte-stride wordlist format
  shared_observation: all six keep the green/yellow/gray state machine symbol-agnostic and none
    weights word selection by letter frequency — the wordle genre transfers to an 85-symbol
    syllabary with constants parameterized; the differentiator is WHERE the small-alphabet
    assumptions sit (keyboard construction, word-list storage, length-as-parameter-or-literal)

